name: Linux production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-production-evidence
          path: test-results/production/
          retention-days: 7
          if-no-files-found: warn
